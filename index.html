    .gold { color: var(--gold); }

    .btn.gold { background: var(--gold); color: var(--ink); border: 0; font-weight: 700; }
    .btn:disabled { opacity: .45; }

    .g2 { grid-template-columns: 1fr 1fr; }
    .g3 { grid-template-columns: 1fr 1fr 1fr; }
    .g4 { grid-template-columns: repeat(4, 1fr); }

    .pick { height: 48px; }
    .pick.on, .seg.on { background: var(--gold); color: var(--ink); border: 0; }
    .pick.tall { height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
    .note { margin-top: 12px; background: var(--raised); border-radius: 16px; padding: 12px; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .step { margin-top: 16px; border: 1px solid rgb(212 175 92 / .3); background: var(--surface); border-radius: 22px; padding: 16px; }
    .field { display: block; font-size: 12px; color: var(--muted); margin-top: 12px; }
    .field input, .field select { margin-top: 4px; height: 48px; width: 100%; border-radius: 16px; border: 1px solid var(--line); background: var(--raised); padding: 0 12px; }
    .row { display: flex; gap: 8px; overflow-x: auto; margin-top: 8px; }
    .pill { height: 40px; flex: 0 0 auto; border-radius: 999px; border: 1px solid var(--line); background: transparent; padding: 0 12px; }
    .link { background: none; border: 0; color: var(--gold); font-weight: 600; padding: 0; }
    .link.dim { color: var(--muted); font-size: 12px; font-weight: 400; }
    .bars { display: flex; align-items: flex-end; gap: 8px; height: 112px; margin-top: 12px; }
    .bars i { display: block; width: 100%; border-radius: 8px 8px 0 0; background: rgb(212 175 92 / .8); }
    .bar { flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; }
    .bar span { margin-top: 4px; font-size: 10px; color: var(--muted); }
    .modal { position: fixed; inset: 0; background: rgb(0 0 0 / .7); display: flex; align-items: center; justify-content: center; padding: 20px; }
    .sheet { width: min(100%, 360px); background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 16px; }
    .dash { border-style: dashed; color: var(--muted); font-size: 14px; }
    .opt { margin-top: 16px; border: 1px dashed var(--line); border-radius: 16px; padding: 12px; }
    header { display: flex; justify-content: space-between; align-items: center; }
    .word { letter-spacing: .2em; font-weight: 600; font-size: 14px; }
  </style>

      if (id === "brain") return state.game === "done";
      if (id === "birth") return lived(state.birth) !== null && hourIndex(state.time) !== null;
      if (id === "blood") return state.blood !== "";
      if (id === "mbti") return state.mbti !== "";
      if (id === "iq") return state.iqDone;
      if (id === "worry") return state.report !== "";
      return true;
    }
    function note(text) { return `<p class="note">${esc(text)}</p>`; }
    function picks(items, on, act) {
      return `<div class="grid g3">${items.map((item, i) => `<button class="pick${on === i ? " on" : ""}" data-act="${act}" data-arg="${i}">${esc(item)}</button>`).join("")}</div>`;
    }

    function save() {
      const today = todayISO();
      const noteDay = state.result ? { date: today, element: state.result[0], act: state.result[1], reading: state.result[2], brain: state.brain, worry: state.worry, report: state.report } : null;
      const days = [...state.days.filter((d) => d.date !== today), ...(noteDay ? [noteDay] : [])].slice(-30);
      const copy = { ...state, days, modal: false, spinning: false, notice: "" };
      localStorage.setItem(KEY, JSON.stringify(copy));
    }
    function load() {
      try {
        const raw = JSON.parse(localStorage.getItem(KEY) || "null");
        if (!raw) return;
        state = { ...blank(), ...raw, modal: false, spinning: false };
        const today = todayISO();
        const todayNote = (state.days || []).find((d) => d.date === today);
        state.days = (state.days || []).filter((d) => d.date !== today);
        if (todayNote) {
          state.result = [todayNote.element, todayNote.act, todayNote.reading];
          state.ready = true;
          state.brain = todayNote.brain;
          state.worry = todayNote.worry || "";
          state.report = todayNote.report || "";
          if (todayNote.brain !== null && todayNote.brain !== undefined) state.game = "done";
        }
      } catch { state = blank(); }
    }

    function openStep(id) { if (!state.opened.includes(id)) state.opened.push(id); state.focus = id; state.tucked = false; state.notice = ""; }
    function restart() {
      const keep = { ...state };
      state.opened = []; state.focus = ""; state.tucked = false; state.ready = false; state.result = null; state.modal = false;
      state.game = "idle"; state.brain = null; state.early = false; state.worry = ""; state.report = "";
      state.backtest = ""; state.taekil = ""; state.taekilOpen = false; state.notice = "";
      state.zodiac = keep.zodiac; state.zodiacOn = keep.zodiacOn; state.sign = keep.sign; state.signOn = keep.signOn;
      state.cal = keep.cal; state.birth = keep.birth; state.time = keep.time; state.ly = keep.ly; state.lm = keep.lm;
      state.ld = keep.ld; state.leap = keep.leap; state.blood = keep.blood; state.mbti = keep.mbti;
      state.iqStep = keep.iqStep; state.iqOk = keep.iqOk; state.iqDone = keep.iqDone; state.hour = keep.hour;
      state.partner = keep.partner; state.saju = keep.saju; state.match = keep.match; state.days = keep.days; state.shareCount = keep.shareCount;
    }
    function clearAll() { localStorage.removeItem(KEY); state = blank(); }

    function spin() {
      if (state.spinning) return;
      const pick = Math.floor(Math.random() * ELEMENTS.length);
      const center = pick * 72 + 36;
      state.spinning = true; state.modal = false;
      state.rotation += 1440 + ((360 - center + 360) % 360);
      paint();
      setTimeout(() => {
        state.result = ELEMENTS[pick];
        state.modal = true; state.spinning = false; state.ready = false;
        paint();
      }, 1450);
    }
    function tapGame() {
      if (state.game === "idle") { state.early = false; state.game = "wait"; paint();
        clearTimeout(timer);
        timer = setTimeout(() => { armed = performance.now(); state.game = "go"; paint(); }, 700 + Math.random() * 1600);
        return;
      }
      if (state.game === "wait") { state.early = true; state.game = "idle"; clearTimeout(timer); paint(); return; }
      if (state.game !== "go") return;
      const ms = Math.round(performance.now() - armed);
      state.brain = Math.max(0, Math.min(1000, Math.round(1000 - (ms - 200) * 2)));
      state.game = "done"; state.early = false; paint();
    }
    function syncLunar() { state.birth = solarFromLunar(state.ly, state.lm, state.ld, state.leap); }

    function stepHead(id, title) {
      const n = STEPS.findIndex((s) => s[0] === id) + 1;
      return `<section class="step"><p class="gold" style="font-size:12px">${n} / ${STEPS.length} · 필수</p><h2 style="margin:8px 0 0">${title}</h2>`;
    }

    function viewStep() {
      const id = currentId();
      if (id === "zodiac") return stepHead(id, "띠") + `<p class="muted">열두 띠 중 오늘 기준 하나를 고르세요.</p>` + picks(ZODIACS.map((z) => z[0] + "띠"), state.zodiacOn ? state.zodiac : -1, "zodiac") + (state.zodiacOn ? note(`${ZODIACS[state.zodiac][0]}띠. ${ZODIACS[state.zodiac][1]}`) : "") + `</section>`;
      if (id === "sign") return stepHead(id, "별자리") + `<p class="muted">태어난 날짜로 고르세요.</p><div class="grid g3">${SIGNS.map((s, i) => `<button class="pick tall${state.signOn && state.sign === i ? " on" : ""}" data-act="sign" data-arg="${i}"><span>${esc(s[0])}자리</span><span style="font-size:11px;opacity:.75">${esc(s[1])}</span></button>`).join("")}</div>${state.signOn ? note(`${SIGNS[state.sign][0]}자리 · ${SIGNS[state.sign][1]}. ${SIGNS[state.sign][2]}`) : ""}</section>`;
      if (id === "brain") {
        const label = state.game === "go" ? "반응" : state.game === "wait" ? "아직" : state.game === "done" ? "측정 완료" : "측정 시작";
        return stepHead(id, "뇌 효율") + `<p style="font-weight:600">${state.game === "go" ? "지금 누르세요" : state.game === "wait" ? "기다리세요" : "뇌 효율 · 1000점"}</p><button class="btn gold" data-act="brain" ${state.game === "done" ? "disabled" : ""}>${label}</button>${state.early ? `<p class="muted">신호 전에 눌러 무효입니다. 다시 재세요.</p>` : ""}${state.brain !== null ? note(`${state.brain} / 1000 · ${band(state.brain)}. ${guide(state.brain)}`) : ""}</section>`;
      }
      if (id === "birth") {
        const days = lived(state.birth);
        const hi = hourIndex(state.time);
        const solar = state.cal === "solar"
          ? `<label class="field">날짜<input id="birth" data-field="birth" type="date" max="${todayISO()}" value="${esc(state.birth)}"></label>`
          : `<div class="grid g3"><label class="field">년<input id="ly" data-field="ly" inputmode="numeric" value="${esc(state.ly)}" placeholder="1990"></label><label class="field">월<select id="lm" data-field="lm">${Array.from({length:12}, (_,i)=>`<option value="${i+1}" ${state.lm==i+1?"selected":""}>${i+1}월</option>`).join("")}</select></label><label class="field">일<select id="ld" data-field="ld">${Array.from({length:30}, (_,i)=>`<option value="${i+1}" ${state.ld==i+1?"selected":""}>${i+1}일</option>`).join("")}</select></label></div><button class="btn${state.leap ? " gold" : ""}" style="margin-top:8px" data-act="leap">윤달</button>`;
        let extra = "";
        if (days !== null && hi !== null) {
          const when = new Date(`${state.birth}T00:00:00`);
          const head = state.cal === "lunar" ? `음력 ${state.ly}.${state.lm}.${state.ld}${state.leap ? " 윤달" : ""} → 양력 ${state.birth}` : `양력 ${state.birth}`;
          extra += note(`${head} · ${state.time} · ${HOURS[hi]}시 ${RANGES[hi]}. ${animalOf(state.birth)}띠 · ${WEEK[when.getDay()]}요일 · 오늘까지 ${days.toLocaleString("ko-KR")}일`);
        }
        if (state.cal === "lunar" && String(state.ly).length === 4 && !state.birth) extra += `<p class="muted">없는 음력 날짜입니다. 월·일과 윤달을 다시 보세요.</p>`;
        if (state.birth && days === null) extra += `<p class="muted">오늘 이전 날짜만 계산됩니다.</p>`;
        if (days !== null) {
          extra += state.saju ? `<div class="opt"><p class="muted" style="font-size:12px">선택 · 건너뛰어도 됩니다</p><p style="font-weight:600">사주</p><p class="muted">시진은 태어난 시간과 같이 움직입니다.</p><div class="grid g4" style="margin-top:8px">${HOURS.map((name,i)=>`<button class="pick${state.hour===i?" on":""}" data-act="hour" data-arg="${i}">${name}시</button>`).join("")}</div>${state.hour!==null?note(`${HOURS[state.hour]}시 · ${RANGES[state.hour]}. 이 시간이 시주 자리입니다.`):""}${state.hour!==null?(state.match?`<div class="opt"><p style="font-weight:600">궁합</p><label class="field">상대 띠 또는 이름<input id="partner" data-field="partner" value="${esc(state.partner)}" placeholder="예: 용띠"></label>${state.partner.trim()?note(`${state.partner.trim()}와 오늘 비교만 남겼습니다. 점수 궁합은 아닙니다.`):""}</div>`:`<button class="btn dash" style="margin-top:12px" data-act="match">선택 · 궁합</button>`):""}</div>` : `<button class="btn dash" style="margin-top:16px" data-act="saju">선택 · 사주</button>`;
        }
        return stepHead(id, "생년월일") + `<div class="grid g2"><button class="pick seg${state.cal==="solar"?" on":""}" data-act="cal" data-arg="solar">양력</button><button class="pick seg${state.cal==="lunar"?" on":""}" data-act="cal" data-arg="lunar">음력</button></div>${solar}<label class="field">태어난 시간<input id="time" data-field="time" type="time" value="${esc(state.time)}"></label>${extra}</section>`;
      }
      if (id === "blood") return stepHead(id, "혈액형") + `<div class="grid g4">${BLOODS.map((b)=>`<button class="pick${state.blood===b?" on":""}" data-act="blood" data-arg="${b}">${b}</button>`).join("")}</div>${state.blood?note(`${state.blood}형으로 기록했습니다. 오늘 점수는 뇌 효율만 바꿉니다.`):""}</section>`;
      if (id === "mbti") return stepHead(id, "MBTI") + `<div class="grid g4">${MBTI.map((t)=>`<button class="pick${state.mbti===t?" on":""}" data-act="mbti" data-arg="${t}">${t}</button>`).join("")}</div>${state.mbti?note(`${state.mbti}. ${mbtiLine(state.mbti)}`):""}</section>`;
      if (id === "iq") {
        if (state.iqDone) return stepHead(id, "IQ") + note(`3문항 중 ${state.iqOk}. 패턴이 또렷합니다. 임상 검사가 아닙니다.`) + `</section>`;
        const item = IQ[state.iqStep];
        return stepHead(id, "IQ") + `<p class="muted">문항 ${state.iqStep + 1} / 3. 임상 검사가 아닙니다.</p><p style="font-weight:600">${esc(item[0])}</p><div class="grid g2">${item[1].map((c,i)=>`<button class="pick" data-act="iq" data-arg="${i}">${esc(c)}</button>`).join("")}</div></section>`;
      }
      if (id === "worry") {
        let block = `<label class="field">한 줄 고민<input id="worry" data-field="worry" value="${esc(state.worry)}" placeholder="이번 주 안에 결정할 일"></label>`;
        if (!state.report) block += `<button class="btn gold" style="margin-top:12px" data-act="diagnose">고민 진단</button>`;
        else {
          block += note(state.report);
          block += state.taekilOpen ? `<div class="opt"><p style="font-weight:600">택일</p><label class="field">후보 날짜<input id="taekil" data-field="taekil" type="date" value="${esc(state.taekil)}"></label>${state.taekil && gap(state.taekil)!==null ? note(`${state.taekil} · ${WEEK[new Date(state.taekil+"T00:00:00").getDay()]}요일 · 오늘 기준 ${gap(state.taekil).toLocaleString("ko-KR")}일. 후보 날짜만 잡아 두었습니다.`) : ""}</div>` : `<button class="btn dash" style="margin-top:16px" data-act="taekil">선택 · 택일</button>`;
        }
        return stepHead(id, "한 줄 고민") + block + `</section>`;
      }
      if (id === "chart") {
        const bars = [[1,42],[2,68],[3,55],[4,80],[5,61],[6,74]].map(([l,h]) => `<div class="bar"><div style="flex:1;width:100%;display:flex;align-items:flex-end"><i style="height:${h}%"></i></div><span>${l}</span></div>`).join("");
        const feng = state.feng ? `<div class="opt"><p style="font-weight:600">풍수</p><div class="grid g4">${DIRS.map((d)=>`<button class="pick${state.dir===d?" on":""}" data-act="dir" data-arg="${d}">${d}</button>`).join("")}</div>${state.dir?note(`${state.dir}쪽을 오늘 확인할 방향으로 잡았습니다.`):""}</div>` : `<button class="btn dash" style="margin-top:16px" data-act="feng">선택 · 풍수</button>`;
        return stepHead(id, "시장 레이어") + `<p class="muted">최근 6구간 예시입니다. 매수 신호가 아닙니다.</p><div class="bars">${bars}</div><p>예시 2,614</p>${feng}</section>`;
      }
      if (id === "backtest") {
        const lines = state.backtest ? state.backtest.split("\n").map(note).join("") : "";
        return stepHead(id, "지난 선택") + `<button class="btn" data-act="backtest">지난 선택 보기</button>${lines}</section>`;
      }
      return "";
    }

    function view() {
      const next = upcoming();
      const cur = currentId();
      let html = `<header><p class="word gold">온결</p></header>`;
      if (!state.opened.length) {
        html += `<h1>오늘의 룰렛</h1><p class="muted">다섯 기운 중 오늘 하나를 먼저 보세요.</p><div class="card"><div class="pointer"></div><div class="wheel-wrap"><div class="wheel" style="transform:rotate(${state.rotation}deg)">${ELEMENTS.map((el,i)=>`<span style="transform:translate(-50%,-50%) rotate(${i*72+36}deg) translateY(-78px) rotate(-${i*72+36}deg)">${el[0]}</span>`).join("")}</div><div class="hub">오늘의 룰렛</div></div><button class="btn gold" data-act="spin" ${state.spinning?"disabled":""}>${state.spinning?"돌아가는 중":"룰렛 돌리기"}</button></div>`;
        if (state.zodiacOn || state.signOn || state.birth || state.blood || state.mbti || state.iqDone) html += `<button class="link dim" data-act="clear">기록 지우기</button>`;
      } else if (state.result) {
        html += `<section class="card" style="margin-top:32px"><p class="gold" style="font-size:12px">룰렛 결과</p><p>${esc(state.result[0])} 강세 · ${esc(state.result[1])}</p></section>`;
      }
      if (state.opened.length) {
        const past = STEPS.filter(([id]) => state.opened.includes(id) && id !== cur);
        html += `<div style="margin-top:24px;display:flex;justify-content:space-between"><p class="muted" style="font-size:12px">지난 단계</p><button class="link" data-act="restart">다시 시작</button></div><div class="row">${past.map(([id,title])=>`<button class="pill" data-act="jump" data-arg="${id}">${title}</button>`).join("")}</div><button class="link dim" data-act="clear">기록 지우기</button>`;
      }
      if (state.days.length) html += `<section class="card" style="margin-top:16px"><p class="muted" style="font-size:12px">지난 오늘</p>${[...state.days].reverse().slice(0,5).map((d)=>`<p style="font-size:14px">${esc(d.date)} · ${esc(d.element)} 강세${d.worry?` · ${esc(d.worry)}`:""}</p>`).join("")}</section>`;
      html += viewStep().replace("</section>", (currentId() && done(currentId()) ? `<button class="btn" style="margin-top:12px" data-act="dismiss">닫기</button>` : "") + "</section>");
      if (state.ready && next && !state.opened.length) html += `<button class="btn gold" style="margin-top:20px" data-act="next">다음 · ${next[1]}</button>`;
      if (state.ready && next && state.opened.length) {
        const ok = cur && done(cur);
        html += `<button class="btn${ok?" gold":""}" style="margin-top:20px" data-act="next">${ok?`다음 · ${next[1]}`:`건너뛰기 · ${next[1]}`}</button>`;
      }
      if (state.report) html += `<button class="btn" style="margin-top:16px" data-act="share">결과 공유</button>`;
      if (state.zodiacOn || state.signOn || state.birth || state.blood || state.mbti || state.iqDone || state.days.length || state.result) html += `<button class="btn" style="margin-top:12px" data-act="export">기록 파일로 남기기</button><label class="btn" style="margin-top:12px;display:grid;place-items:center">기록 가져오기<input id="import" type="file" accept="application/json" hidden></label>`;
      if (state.shareCount >= 3) html += `<button class="btn" style="margin-top:12px" data-act="invite">친구 초대</button>`;
      if (state.notice) html += `<p class="gold" style="font-size:14px">${esc(state.notice)}</p>`;
      if (state.opened.includes("worry")) html += `<p class="muted" style="margin-top:24px;font-size:12px">데이터 분석과 자기성찰 도구입니다. 금융·법률의 최종 책임은 사용자에게 있습니다.</p>`;
      if (state.modal && state.result) html += `<div class="modal" role="dialog"><div class="sheet"><p class="gold" style="font-size:12px">오늘의 결과</p><h2 style="margin:8px 0">${esc(state.result[0])} 강세</h2><p class="muted">${esc(state.result[2])}</p><p>${esc(state.result[1])}</p><button class="btn" data-act="close">닫기</button></div></div>`;
      return html;
    }

    function paint() {
      const active = document.activeElement;
      const id = active && active.id;
      const pos = active && active.selectionStart;
      document.getElementById("app").innerHTML = view();
      if (id) {
        const el = document.getElementById(id);
        if (el) { el.focus(); if (typeof pos === "number" && el.setSelectionRange) el.setSelectionRange(pos, pos); }
      }
    }

    async function shareResult() {
      if (!state.result || !state.report) return;
      const text = [`온결 ${state.result[0]} 강세 · ${state.result[1]}`, state.brain === null ? "" : `뇌 효율 ${state.brain} / 1000`, state.worry.trim(), state.report].filter(Boolean).join("\n");
      try {
        if (navigator.share) await navigator.share({ title: "온결", text });
        else await navigator.clipboard.writeText(text);
        state.shareCount += 1;
        state.notice = "결과만 공유했습니다. 생일과 성향은 빠집니다.";
      } catch { state.notice = "공유를 취소했습니다."; }
      save(); paint();
    }

    document.getElementById("app").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-act]");
      if (!button) return;
      const act = button.dataset.act;
      const arg = button.dataset.arg;
      if (act === "spin") spin();
      else if (act === "close") { state.modal = false; state.ready = true; save(); paint(); }
      else if (act === "next") { const n = upcoming(); if (n) { openStep(n[0]); save(); paint(); } }
      else if (act === "jump") { state.focus = arg; state.tucked = false; paint(); }
      else if (act === "dismiss") { state.tucked = true; paint(); }
      else if (act === "restart") { restart(); save(); paint(); }
      else if (act === "clear") { clearAll(); paint(); }
      else if (act === "zodiac") { state.zodiac = Number(arg); state.zodiacOn = true; save(); paint(); }
      else if (act === "sign") { state.sign = Number(arg); state.signOn = true; save(); paint(); }
      else if (act === "brain") tapGame();
      else if (act === "cal") { state.cal = arg; if (arg === "lunar") syncLunar(); save(); paint(); }
      else if (act === "leap") { state.leap = !state.leap; syncLunar(); save(); paint(); }
      else if (act === "saju") { state.saju = true; paint(); }
      else if (act === "hour") { state.hour = Number(arg); state.time = STARTS[state.hour]; save(); paint(); }
      else if (act === "match") { state.match = true; paint(); }
      else if (act === "blood") { state.blood = arg; save(); paint(); }
      else if (act === "mbti") { state.mbti = arg; save(); paint(); }
      else if (act === "iq") {
        if (Number(arg) === IQ[state.iqStep][2]) state.iqOk += 1;
        if (state.iqStep + 1 >= IQ.length) state.iqDone = true; else state.iqStep += 1;
        save(); paint();
      }
      else if (act === "diagnose") {
        const field = document.getElementById("worry");
        if (field) state.worry = field.value;
        if (!state.worry.trim()) return;
        state.report = `${state.worry.trim()}. ${state.brain === null ? "사실과 해석을 나누고, 한 가지만 진행하세요." : guide(state.brain)}`;
        save(); paint();
      }
      else if (act === "taekil") { state.taekilOpen = true; paint(); }
      else if (act === "feng") { state.feng = true; paint(); }
      else if (act === "dir") { state.dir = arg; save(); paint(); }
      else if (act === "backtest") {
        state.backtest = state.brain !== null && state.brain < 600
          ? "자중일 다음 날의 선택이 남았습니다.\n바로 실행한 날은 범위가 컸습니다.\n한 가지만 고른 날이 가장 짧았습니다."
          : "한 가지만 고른 날이 남았습니다.\n여러 개를 같은 날 연 날은 흐렸습니다.\n자중 다음 날이 실행에 맞았습니다.";
        save(); paint();
      }
      else if (act === "share") shareResult();
      else if (act === "invite") {
        const text = "온결에서 오늘 하나를 골라 보세요.";
        try {
          if (navigator.share) await navigator.share({ title: "온결", text, url: location.href });
          else await navigator.clipboard.writeText(`${text} ${location.href}`);
          state.notice = "초대 링크를 준비했습니다. 친구는 룰렛부터 시작합니다.";
        } catch { state.notice = "초대를 취소했습니다."; }
        paint();
      }
      else if (act === "export") {
        const blob = new Blob([localStorage.getItem(KEY) || "{}"], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "onkyeol.json";
        a.click();
        state.notice = "기록 파일을 저장했습니다. 다른 기기에서는 가져오기로 여세요.";
        paint();
      }
    });
    document.getElementById("app").addEventListener("input", (event) => {
      const input = event.target;
      if (!input.dataset || !input.dataset.field) return;
      state[input.dataset.field] = input.value;
      if (input.dataset.field === "time") state.hour = hourIndex(input.value);
      if (["ly", "lm", "ld"].includes(input.dataset.field)) syncLunar();
      save();
    });
    document.getElementById("app").addEventListener("change", (event) => {
      const input = event.target;
      if (input.id === "import" && input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = () => {
          try { localStorage.setItem(KEY, String(reader.result)); load(); state.notice = "기록 파일을 가져왔습니다."; }
          catch { state.notice = "파일을 읽지 못했습니다."; }
          paint();
        };
        reader.readAsText(input.files[0]);
        return;
      }
      if (!input.dataset || !input.dataset.field) return;
      state[input.dataset.field] = input.value;
      if (input.dataset.field === "time") state.hour = hourIndex(input.value);
      if (["ly","lm","ld"].includes(input.dataset.field)) syncLunar();
      save();
      if (input.dataset.field !== "worry" && input.dataset.field !== "partner") paint();
    });

    load();
    paint();
  </script>
</body>
</html>
